config:
  # ---------------- MinerU 精准解析 API (Standard API) ----------------
  # https://mineru.net/apiManage/docs — 高精度、支持完整PDF、表格/公式多格式输出
  # ⚠️ 密钥不落盘：请设置环境变量 MINERU_API_KEY（参考 .env.example）
  mineru:
    base_url: "https://mineru.net/api/v4"          # 精准解析端点
    max_file_size_mb: 200                          # 精准接口限制 200MB
    max_pages: 200                                 # 精准接口限制 200 页
    model_version: "vlm"                           # 推荐模型版本
    timeout_sec: 60
    poll_interval_sec: 3
    poll_max_sec: 600
  # ---------------- Qwen LLM API ----------------
  # ⚠️ 密钥不落盘：请设置环境变量 DASHSCOPE_API_KEY（参考 .env.example）
  llm:
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-plus"                             # qwen-turbo / qwen-plus / qwen-max
    temperature: 0.7
    max_tokens: 8192
    timeout_sec: 120
  # ---------------- 项目统一路径（相对路径以仓库根为基准） ----------------
  paths:
    datasets_dir: "Datasets"
    output_dir: "output"
    mineru_output_dir: "output/mineru_output"
    structure_tree_output_dir: "output/structure_tree_output"
    llm_output_dir: "output/llm_output"
    processed_dir: "output/processed"
    logs_dir: "output/logs"
