<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Component Extractor - Register</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/api.js" defer></script>
    <script src="js/register.js" defer></script>
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-brand">

            <div class="brand-icon">⚡</div>

            <h1>Component Extractor</h1>

            <p>Electronic Component Parameter Extraction and Search System</p>

        </div>

        <div class="login-card">

            <h2>Create Account</h2>

            <p class="login-subtitle">
                Register a standard user account. Administrator and auditor roles are assigned by an administrator.
            </p>

            <form id="registerForm">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="3-50 characters"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="At least 8 characters"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Repeat your password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div id="registerMessage" class="message"></div>

                <button
                    type="submit"
                    id="registerButton"
                    class="primary-button"
                >
                    Create Account
                </button>

            </form>

            <div class="login-footer">
                Already have an account?
                <a href="login.html">Sign in</a>
            </div>

        </div>

    </div>

</body>

</html>
